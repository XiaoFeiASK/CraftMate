# Local development services.
#
# SQLite is a library, not a server, so there is no database container.
# The `db-check` service validates the schema against a real WAL file
# database on a named volume, which is the only way to test locking and
# journal behaviour. Once a server-backed dependency exists (for example an
# embedding service or object storage), add it here instead of installing it
# on the host.
#
# The desktop shell (Tauri) stays on the host: it needs a window server and
# the macOS audio devices.

services:
  orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Override when Docker Hub is unreachable, e.g.
        # NODE_IMAGE=docker.m.daocloud.io/library/node:22-alpine
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    ports:
      - "${CRAFTMATE_PORT:-4321}:4321"
    environment:
      CRAFTMATE_PORT: "4321"
      # Loopback inside the container is unreachable from the host.
      CRAFTMATE_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run start -w @craftmate/orchestrator

  db-check:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - craftmate-db:/data
    command: npm run db:check:file
    profiles: ["check"]

volumes:
  node_modules:
  craftmate-db:
